[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tzdata-pipeline"
version = "0.1.10"
description = "Normalise event timestamps arriving from mixed-offset feeds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pytz==2023.3"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["tzdata_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
